name: EMS CI/CD pipeline

on:
  push:
   branches:
      - ci-cd-for-ems-app

jobs:
 build_and_deploy:
  runs-on: ubuntu-latest

  steps:
    - name: checkout code
      uses: actions/checkout@v3
    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'openJDK / temurin'
    - name: Build with Maven
      uses: mvn clean package -DskipTests
    - name: Build Docker Image
      uses: docker build -t ${{secrets.DOCKERHUB_USERNAME}}/ems-app:latest
    - name: Login into docker hub
      run: echo ${{secrets.DOKCERHUB_TOKEN}} | docker login -u ${{secrets.DOCKERHUB_USERNAME}} -- password-stdin
    - name: push docker image to Docker Hub
      run: docker push ${{secrets.DOCKERHUB_USERNAME}}/ems-app:latest
    - name: Deploy on EC2
      uses: appleboy/ssh-action@v0.1.10
  with:
    host:  ${{secrets.EC2_HOST}}
    username: ec2-user
    key: ${{secrets.EC2_KEY}}
    script: |
      docker pull ${{secrets.DOCKERHUB_USERNAME}}/ems-app:latest
      docker stop ems-container || true
      docker rm ems-container || true
      docker run -d -p 8080:8080 -e SPRING_DATASOURCE_URL = jdbc:postgresql://<rds-endpoint>:5432/ems_db -e SPRING_DATASOURCE_USERNAME=postgres 
      -e SPRING_DATASOURCE_PASSWORD=Nazeeruddin --name ems-container ${{secrets.DOCKERHUB_USERNAME}}/ems-app:latest